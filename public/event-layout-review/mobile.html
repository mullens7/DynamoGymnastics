<!doctype html><html><head><meta name="robots" content="noindex"><title>Mobile event verification</title></head><body style="margin:0;background:#eee"><div style="text-align:center;padding:10px"><label>Screen width <select id="width"><option>320</option><option selected>375</option><option>430</option></select></label> <label>View <select id="mode"><option value="/event-layout-review/">Editor</option><option value="/event-layout-review/basket/">Basket</option><option value="/events/test-event/">Public event</option></select></label></div><iframe title="Mobile event editor" src="/event-layout-review/" style="border:0;width:375px;height:810px;display:block;margin:20px auto"></iframe><script>document.getElementById('width').onchange=e=>document.querySelector('iframe').style.width=e.target.value+'px';document.getElementById('mode').onchange=e=>document.querySelector('iframe').src=e.target.value;</script></body></html>
