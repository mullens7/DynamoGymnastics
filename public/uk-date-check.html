<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>UK date field check</title><link rel="stylesheet" href="/account/account.css"><link rel="stylesheet" href="/uk-dates.css"><script src="/uk-dates.js"></script></head><body><main class="account-main"><section class="card"><h1>UK date format check</h1><p>Example dates used for verification.</p><form id="check"><label for="dob">Date of birth</label><input id="dob" name="dateOfBirth" type="date" value="2013-06-22" required><label for="start">Start date</label><input id="start" name="startDate" type="date" value="2026-10-12" required><button class="primary" style="margin-top:20px">Check values</button></form><p id="result" role="status"></p></section></main><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#result').textContent=JSON.stringify(Object.fromEntries(new FormData(e.target)));};</script></body></html>
