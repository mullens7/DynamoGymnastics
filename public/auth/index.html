<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Log in | Dynamo Gymnastics</title><link rel="stylesheet" href="/account/account.css"></head><body class="login-page"><div class="login-wrap"><a href="/"><img class="login-logo" src="/assets/dynamo-logo.svg" alt="Dynamo Gymnastics"></a><section class="card"><h1>Log in to Dynamo</h1><p id="intro">Enter your email address. We’ll send you a four-digit code.</p><form id="email-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254"><button class="primary" type="submit">Send login code</button></form><form id="code-form" hidden><label for="code">Four-digit login code</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" maxlength="4" required><button class="primary" type="submit">Confirm and log in</button><button class="secondary" type="button" id="resend">Resend code</button><button class="link" type="button" id="change">Use a different email</button><p class="help">Your code expires in 10 minutes.</p></form><p id="status" role="status"></p><p class="help">New here? Your account is created when you confirm your email. No password needed.</p></section><a class="back" href="/">Back to website</a></div><script src="/auth/login.js"></script></body></html>
