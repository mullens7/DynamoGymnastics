<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Dynamo | Your account</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#19569b;font:15px Arial,sans-serif;color:#25364b}.wrap{width:430px;max-width:calc(100vw - 36px);padding:35px 0}.logo{width:230px;height:65px;object-fit:contain;display:block;margin:0 auto 30px}.card{background:white;border-radius:12px;padding:35px}h1{font-size:26px;margin:0 0 12px}p{color:#718097;line-height:1.6}.tabs{display:flex;gap:8px;margin:25px 0}.tabs button{flex:1;padding:12px;background:#eff4fa;border:0;color:#19569b;border-radius:6px;font:inherit;cursor:pointer}.tabs button.active{background:#19569b;color:white}label{display:block;margin:18px 0 8px;font-size:13px}input{width:100%;border:1px solid #dbe2ec;padding:12px;border-radius:6px}button.submit{width:100%;background:#19569b;color:#fff;padding:13px;border:0;border-radius:6px;margin-top:25px;font:inherit}small{display:block;color:#718097;line-height:1.6;margin-top:16px}.foot{text-align:center;color:#d7e7fa;margin-top:25px}.foot a{color:white}</style></head><body><div class="wrap"><img class="logo" src="/assets/dynamo-logo.svg" alt="Dynamo Gymnastics"><div class="card"><h1>Your Dynamo account</h1><p>Bookings and member benefits, in one place.</p><div class="tabs"><button class="active" id="login" type="button">Log in</button><button id="signup" type="button">Sign up</button></div><label for="email">Email address</label><input id="email" type="email" placeholder="Authentication preview" disabled><label for="password">Password</label><input id="password" type="password" placeholder="Not connected yet" disabled><button class="submit" id="submit" disabled>Log in</button><small>Preview only. Account creation and login will be enabled when secure authentication is connected.</small></div><div class="foot"><a href="/">Back to website</a></div></div><script>for(const id of ['login','signup'])document.getElementById(id).onclick=()=>{for(const x of ['login','signup'])document.getElementById(x).classList.toggle('active',x===id);document.getElementById('submit').textContent=id==='login'?'Log in':'Create account'};</script></body></html>
