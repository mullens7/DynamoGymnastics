<!doctype html><html><head><meta name="robots" content="noindex"><title>Class layout check</title></head><body style="margin:0;background:#eee"><div style="text-align:center;padding:10px"><label>Width <select id="width"><option>320</option><option selected>375</option><option>430</option></select></label> <label>View <select id="view"><option value="/classes/">Public schedule</option><option value="/class-layout-review/">Editor</option></select></label></div><iframe title="Class layout" src="/classes/" style="width:375px;height:820px;border:0;display:block;margin:auto"></iframe><script>document.getElementById('width').onchange=e=>document.querySelector('iframe').style.width=e.target.value+'px';document.getElementById('view').onchange=e=>document.querySelector('iframe').src=e.target.value;</script></body></html>
