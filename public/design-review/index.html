<!doctype html><html><head><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynamo responsive layout check</title><style>body{margin:0;background:#e8edf4;font:14px Arial}header{padding:14px;display:flex;gap:15px;align-items:center}iframe{display:block;border:0;background:white;height:850px;max-width:100%;margin:0 auto}select{padding:10px;font-size:16px}</style></head><body><header><strong>Responsive review</strong><label>Width <select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Page <select id="page"><option value="/">Home</option><option value="/classes/">Classes</option><option value="/parties/">Parties</option><option value="/octoberhalfterm/">Activities</option><option value="/gallery/">Gallery</option><option value="/contact-us/">Contact</option><option value="/policies/">Policies</option><option value="/terms/">Terms</option><option value="/auth/">Login</option></select></label><span id="result"></span></header><iframe title="Responsive page" id="frame" width="390" src="/"></iframe><script>const f=document.querySelector('#frame');document.querySelector('#width').onchange=e=>f.width=e.target.value;document.querySelector('#page').onchange=e=>f.src=e.target.value;f.onload=()=>document.querySelector('#result').textContent='Loaded';</script></body></html>
